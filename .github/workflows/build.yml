name: Build NEXORA Performance
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $version = "0.1.${{ github.run_number }}.0"
          $path = "src/NEXORA.App/Properties/AssemblyInfo.cs"
          $assembly = Get-Content $path -Raw
          $assembly = $assembly -replace 'AssemblyVersion\("[^"]+"\)', ('AssemblyVersion("' + $version + '")')
          $assembly = $assembly -replace 'AssemblyFileVersion\("[^"]+"\)', ('AssemblyFileVersion("' + $version + '")')
          Set-Content -Path $path -Value $assembly -NoNewline
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Build solution
        run: msbuild NEXORA.sln /m /p:Configuration=Release /p:Platform="Any CPU" /verbosity:minimal
      - name: Package application
        shell: pwsh
        run: Compress-Archive -Path "src/NEXORA.App/bin/Release/*" -DestinationPath "NEXORA-Performance.zip" -Force
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-Performance-v${{ steps.version.outputs.version }}
          path: NEXORA-Performance.zip
          if-no-files-found: error
      - name: Publish update release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: NEXORA Performance v${{ steps.version.outputs.version }}
          body: |
            NEXORA_VERSION=${{ steps.version.outputs.version }}

            Automatic update package for NEXORA Performance.
          files: NEXORA-Performance.zip
          overwrite_files: true
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
